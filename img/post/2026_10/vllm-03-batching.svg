<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" viewBox="0 0 760 400" role="img" aria-label="有請求結束就立刻補位,GPU 不必等最慢的那個" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">有請求結束就立刻補位,GPU 不必等最慢的那個</text><text x="24" y="64" font-weight="600" fill="#1f1e1d">Static batching:整批一起進、一起出,先結束的要空等</text><g><rect x="100" y="84" width="600" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="100" y="114" width="150" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="250" y="114" width="450" height="22" rx="6" fill="none" stroke="#8c8b83" stroke-width="1" stroke-dasharray="4 4"></rect><rect x="100" y="144" width="300" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="400" y="144" width="300" height="22" rx="6" fill="none" stroke="#8c8b83" stroke-width="1" stroke-dasharray="4 4"></rect><rect x="100" y="174" width="90" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="190" y="174" width="510" height="22" rx="6" fill="none" stroke="#8c8b83" stroke-width="1" stroke-dasharray="4 4"></rect><text x="24" y="100" fill="#1f1e1d">請求 A</text><text x="24" y="130" fill="#1f1e1d">請求 B</text><text x="24" y="160" fill="#1f1e1d">請求 C</text><text x="24" y="190" fill="#1f1e1d">請求 D</text><text x="475" y="130" text-anchor="middle" font-size="11.5" fill="#5e5d59">等最長的請求跑完</text></g><line x1="24" x2="736" y1="206" y2="206" stroke="#e3e2dc"></line><text x="24" y="232" font-weight="600" fill="#1f1e1d">Continuous batching:每一步都檢查,有位置就補新請求</text><g><rect x="100" y="244" width="600" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="100" y="274" width="150" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="250" y="274" width="450" height="22" rx="6" fill="#2c84db" fill-opacity="0.12" stroke="#2c84db" stroke-width="2"></rect><rect x="100" y="304" width="300" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="400" y="304" width="300" height="22" rx="6" fill="#2c84db" fill-opacity="0.12" stroke="#2c84db" stroke-width="2"></rect><rect x="100" y="334" width="90" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><rect x="190" y="334" width="510" height="22" rx="6" fill="#2c84db" fill-opacity="0.12" stroke="#2c84db" stroke-width="2"></rect><text x="24" y="260" fill="#1f1e1d">位置 1</text><text x="24" y="290" fill="#1f1e1d">位置 2</text><text x="24" y="320" fill="#1f1e1d">位置 3</text><text x="24" y="350" fill="#1f1e1d">位置 4</text><text x="400" y="259" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 A</text><text x="175" y="289" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 B</text><text x="475" y="289" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 E</text><text x="250" y="319" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 C</text><text x="550" y="319" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 F</text><text x="145" y="349" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 D</text><text x="445" y="349" text-anchor="middle" font-size="11.5" fill="#1f1e1d">請求 G</text></g><g><rect x="24" y="370" width="16" height="22" rx="6" fill="#8c8b83" fill-opacity="0.15" stroke="#8c8b83" stroke-width="1.25"></rect><text x="48" y="382" font-size="11.5" fill="#5e5d59">原本的請求</text><rect x="168" y="370" width="16" height="22" rx="6" fill="#2c84db" fill-opacity="0.12" stroke="#2c84db" stroke-width="2"></rect><text x="192" y="382" font-size="11.5" fill="#5e5d59">新補進來的請求</text><rect x="340" y="370" width="16" height="22" rx="6" fill="none" stroke="#8c8b83" stroke-width="1" stroke-dasharray="4 4"></rect><text x="364" y="382" font-size="11.5" fill="#5e5d59">GPU 閒置</text></g></svg>