<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="520" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" viewBox="0 0 760 260" role="img" aria-label="Prefix cache 只佔用沒人在用的 block" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="bs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c8b83"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Prefix cache 只佔用沒人在用的 block</text><g fill="none" stroke="#8c8b83" stroke-width="1.25"><path d="M192 100H296" marker-end="url(#bs-arrow)"></path><path d="M296 124H192" marker-end="url(#bs-arrow)"></path><path d="M464 100H568" marker-end="url(#bs-arrow)"></path><path d="M568 124H464" marker-end="url(#bs-arrow)"></path><path d="M652 148V216H108V148" marker-end="url(#bs-arrow)"></path></g><g><rect x="24" y="72" width="168" height="76" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="108" y="96" text-anchor="middle" font-weight="600" fill="#1f1e1d">空閒、無內容</text><text x="108" y="112" text-anchor="middle" font-size="11.5" fill="#5e5d59">隨時可分配</text></g><g><rect x="296" y="72" width="168" height="76" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="380" y="96" text-anchor="middle" font-weight="600" fill="#1f1e1d">使用中</text><text x="380" y="112" text-anchor="middle" font-size="11.5" fill="#5e5d59">ref count &gt; 0</text><text x="380" y="128" text-anchor="middle" font-size="11.5" fill="#5e5d59">不能被動</text></g><g><rect x="568" y="72" width="168" height="76" rx="8" fill="#2c84db" fill-opacity="0.12" stroke="#2c84db" stroke-width="2"></rect><text x="652" y="96" text-anchor="middle" font-weight="600" fill="#1f1e1d">空閒、保有快取</text><text x="652" y="112" text-anchor="middle" font-size="11.5" fill="#5e5d59">ref count = 0</text><text x="652" y="128" text-anchor="middle" font-size="11.5" fill="#5e5d59">內容留著等重用</text></g><text x="244" y="92" text-anchor="middle" font-size="11.5" fill="#5e5d59">新請求分配</text><text x="244" y="140" text-anchor="middle" font-size="11.5" fill="#5e5d59">結束(無快取)</text><text x="516" y="92" text-anchor="middle" font-size="11.5" fill="#5e5d59">結束(有快取)</text><text x="516" y="140" text-anchor="middle" font-size="11.5" fill="#5e5d59">前綴命中</text><text x="380" y="236" text-anchor="middle" font-size="11.5" fill="#5e5d59">空間不足時,依 LRU 淘汰最久沒用的</text></svg>