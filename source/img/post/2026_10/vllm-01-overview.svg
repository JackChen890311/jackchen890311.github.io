<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="680" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" viewBox="0 0 760 340" role="img" aria-label="三項技術各管一段:排程、記憶體、重用" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c8b83"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">三項技術各管一段:排程、記憶體、重用</text><g fill="none" stroke="#8c8b83" stroke-width="1.25"><path d="M172 110H212" marker-end="url(#ov-arrow)"></path><path d="M360 110H400" marker-end="url(#ov-arrow)"></path><path d="M548 110H588" marker-end="url(#ov-arrow)"></path><path d="M474 216V156" marker-end="url(#ov-arrow)"></path><path d="M662 156V300H286V156" marker-end="url(#ov-arrow)"></path></g><g><rect x="24" y="64" width="148" height="92" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="98" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1d">請求佇列</text><text x="98" y="104" text-anchor="middle" font-size="11.5" fill="#5e5d59">多位使用者的</text><text x="98" y="120" text-anchor="middle" font-size="11.5" fill="#5e5d59">請求同時進來</text></g><g><rect x="212" y="64" width="148" height="92" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="286" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1d">排程器</text><text x="286" y="104" text-anchor="middle" font-size="11.5" fill="#5e5d59">Continuous Batching</text><text x="286" y="120" text-anchor="middle" font-size="11.5" fill="#5e5d59">每一步重新挑請求</text><text x="286" y="136" text-anchor="middle" font-size="11.5" fill="#5e5d59">做完就換人進來</text></g><g><rect x="400" y="64" width="148" height="92" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="474" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1d">KV cache 管理</text><text x="474" y="104" text-anchor="middle" font-size="11.5" fill="#5e5d59">PagedAttention</text><text x="474" y="120" text-anchor="middle" font-size="11.5" fill="#5e5d59">頁表記錄位置</text><text x="474" y="136" text-anchor="middle" font-size="11.5" fill="#5e5d59">按需分配與回收</text></g><g><rect x="588" y="64" width="148" height="92" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="662" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1d">GPU 計算</text><text x="662" y="104" text-anchor="middle" font-size="11.5" fill="#5e5d59">attention kernel</text><text x="662" y="120" text-anchor="middle" font-size="11.5" fill="#5e5d59">透過頁表讀取 KV</text><text x="662" y="136" text-anchor="middle" font-size="11.5" fill="#5e5d59">數學結果不變</text></g><g><rect x="364" y="216" width="220" height="56" rx="8" fill="none" stroke="#8c8b83" stroke-width="1.25"></rect><text x="474" y="240" text-anchor="middle" font-weight="600" fill="#1f1e1d">Prefix Caching</text><text x="474" y="256" text-anchor="middle" font-size="11.5" fill="#5e5d59">相同前綴的 block 直接重用</text></g><text x="486" y="190" font-size="11.5" fill="#5e5d59">命中就省掉 prefill</text><text x="474" y="322" text-anchor="middle" font-size="11.5" fill="#5e5d59">每生成一個 token 就重複一次</text></svg>